{%- assign p = site.data.profile -%}
<header class="site-header">
  <div class="wrapper">
    <a class="site-title" href="{{ site.baseurl }}/#about">{% if p.first_name %}<b>{{ p.first_name }}</b>{{ p.name | remove_first: p.first_name }}{% else %}{{ p.name }}{% endif %}</a>
    <nav class="site-nav" aria-label="Sections">
      <a class="page-link" href="{{ site.baseurl }}/#about">About</a>
      <a class="page-link" href="{{ site.baseurl }}/#publications">Publications</a>
      {%- for l in p.links %}{% if l.label == "CV" %}
      <a class="page-link" href="{{ l.url | prepend: site.baseurl }}">CV</a>
      {%- endif %}{% endfor %}
      <button class="toggle" type="button" aria-label="Switch to dark mode" id="themeToggle">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
