# Publications, newest first. The order inside a year is the display order.
#
# key       : unique id; used as the anchor (/#key) and by tools/bib2links.py
# authors   : plain text. Your name (profile.yml) is highlighted automatically.
#             Mark equal contribution with * and corresponding authors with †.
# venue     : venue line under the authors (e.g. "CVPR 2026")
# note      : optional extra line (e.g. a workshop version or an award)
# areas     : one or more of physical | interp | rep | other, e.g. [physical, rep].
#             Shown as tags next to the venue; a paper appears under every matching tab.
# selected  : true shows the paper under the default "Selected" tab
# preprint  : true lists it under "Preprints" instead of its year
# links     : optional; any of paper, code, project, video, slides, poster


