# Paragraphs before the research list. Markdown is allowed.
bio:
  - >-
    My current goal is to make **code-as-policy** and **agent-as-policy** reliable for manipulation,
    locomotion, and dexterous control, by improving both the reasoning of the underlying LLMs
    and the harnesses (tools, memory, and execution loops) around them. My research builds on
    three branches: (1) Physical AI, (2) LLMs, MLLMs, and agents, and (3) interpretability of
    these models. I am now weaving these branches together toward this goal.

# Research topics, shown as a bulleted list (same as the CV).
# filter: optional tab id from filters.yml; the topic name then opens that tab.
research:
  - title: Physical AI
    filter: physical
    text: representation learning and post-training for robot control, World Action Models, and Vision-Language-Action models.
  - title: LLMs, MLLMs, and agents
    filter: mllm
    text: LLM reasoning, on-policy distillation, memory agents, and video editing agents.
  - title: Interpretability
    filter: interp
    text: mechanistic analysis of reasoning and information flow across LLMs, Vision-Language-Action models, and omnimodal LLMs.
  - title: Scalable representation learning (earlier work)
    filter: rep
    text: self-supervised visual representation learning and masked image modeling.

# Paragraphs after the research list.
